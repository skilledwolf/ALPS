# Hirsch-Fye impurity solver. The standalone executable reads exactly these
# settings; the DMFT driver composes and launches the same executable.
application = "hirschfye"
schema_version = 1

[parameters.BETA]
type = "float64"
required = true
min = 0.0

[parameters.U]
type = "float64"
required = true
min = 0.0

[parameters.MU]
type = "float64"
default = 0.0

[parameters.H]
type = "float64"
default = 0.0

[parameters.N]
type = "int64"
required = true
min = 1
max = 2147483646
description = "Imaginary-time slices."

[parameters.NMATSUBARA]
type = "int64"
required = true
min = 1
max = 2147483647

[parameters.FLAVORS]
type = "int64"
default = 2
choices = [2]

[parameters.SITES]
type = "int64"
default = 1
choices = [1]

[parameters.SWEEPS]
type = "int64"
required = true
min = 1

[parameters.THERMALIZATION]
type = "int64"
default = 0
min = 0

[parameters.TOLERANCE]
type = "float64"
default = 1e-06
min = 0.0

# First and second band moments for the high-frequency tails.
[parameters.EPS_0]
type = "float64"

[parameters.EPS_1]
type = "float64"

[parameters.EPSSQ_0]
type = "float64"

[parameters.EPSSQ_1]
type = "float64"

[input.g0]
type = "path"
required = true
description = "HDF5 file with complex /G0_0 and /G0_1 vectors of NMATSUBARA values."

[output.results]
type = "path"
required = true

[execution.seed]
type = "int64"
default = 42
min = 0
max = 4294967295

[execution.time_limit]
type = "int64"
default = 0
min = 0
max = 2147483647
description = "Seconds; 0 disables the limit."

[execution.bins]
type = "int64"
default = 128
min = 2
max = 2147483647
description = "Even number of native ALEA batch slots."
