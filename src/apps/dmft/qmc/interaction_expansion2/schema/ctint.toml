application = "ctint"
schema_version = 1

[parameters.BETA]
type = "float64"
required = true
min = 0.0

[parameters.U]
type = "float64"
description = "Intra-band interaction; required unless input.interaction_matrix is supplied."

[parameters.J]
type = "float64"
default = 0.0

[parameters."U'"]
type = "float64"
description = "Inter-band interaction; defaults to U - 2*J."

[parameters.MU]
type = "float64"
required = true

[parameters.ALPHA]
type = "float64"
required = true

[parameters.FLAVORS]
type = "int64"
default = 2
min = 2
max = 128
description = "Number of diagonal fermion flavors. Generated Hund interactions require paired flavors; an explicit matrix also supports odd counts."

[parameters.SITES]
type = "int64"
default = 1
choices = [1]

[parameters.N]
type = "int64"
required = true
min = 2
max = 214748363

[parameters.NMATSUBARA]
type = "int64"
required = true
min = 1
max = 2147483647

[parameters.NMATSUBARA_MEASUREMENTS]
type = "int64"
min = 1
max = 2147483647

[parameters.NSELF]
type = "int64"
min = 1
max = 2147483646

[parameters.MAX_ORDER]
type = "int64"
default = 2048
min = 1
max = 2147483647

[parameters.SWEEPS]
type = "int64"
required = true
min = 1

[parameters.THERMALIZATION]
type = "int64"
required = true
min = 0

[parameters.RECALC_PERIOD]
type = "int64"
default = 5000
min = 1
max = 2147483647

[parameters.MEASUREMENT_PERIOD]
type = "int64"
default = 200
min = 1
max = 2147483647

[parameters.ALMOSTZERO]
type = "float64"
default = 1.0e-16
min = 0.0

[parameters.HISTOGRAM_MEASUREMENT]
type = "bool"
default = false

[parameters.TAU_DISCRETIZATION_FOR_EXP]
type = "int64"
min = 1
max = 2147483647

[parameters.H]
type = "float64"
default = 0.0

[parameters.EPS_0]
type = "float64"
default = 0.0

[parameters.EPS_1]
type = "float64"
default = 0.0

[parameters.EPSSQ_0]
type = "float64"
default = 1.0

[parameters.EPSSQ_1]
type = "float64"
default = 1.0

[input.g0]
type = "path"
description = "HDF5 file with complex /G0_f vectors of NMATSUBARA values for every flavor."

[input.interaction_matrix]
type = "path"
description = "Text triplets i j U_ij using zero-based flavor indices. The matrix must be finite, symmetric and have a zero diagonal; omitted entries are zero. Overrides U, J and U'."

[input.atomic]
type = "bool"
default = false
description = "Use G0(iw)=1/(iw) for a zero-energy half-filled atomic level; MU, H, EPS_f and EPSSQ_f must be zero."

[output.results]
type = "path"
required = true

[execution.time_limit]
type = "int64"
default = 0
min = 0
max = 2147483647
description = "Wall-clock limit in seconds; zero disables the time limit."

[execution.seed]
type = "int64"
default = 42
min = 0
max = 2147483647

[execution.bins]
type = "int64"
default = 128
min = 2
max = 2147483647
description = "Even number of native batch slots; at least two are required for rebinning."

[execution.check_interval]
type = "float64"
default = 1.0
min = 0.0
description = "Maximum MPI progress/time-limit checking interval in seconds."
