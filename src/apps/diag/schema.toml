schema_version = 1
[parameters.LATTICE]
type = "string"
[parameters.GRAPH]
type = "string"
[parameters.MODEL]
type = "string"
required = true
# Quantum numbers whose sectors are diagonalized separately, e.g. "N,Sz".
[parameters.CONSERVED_QUANTUMNUMBERS]
type = "string"
# A single momentum sector, e.g. "0" or "3.14159 0"; by default all momenta.
[parameters.TOTAL_MOMENTUM]
type = "string"
[parameters.TRANSLATION_SYMMETRY]
type = "bool"
default = true
# Complex arithmetic; chosen by default when Bloch states are used.
[parameters.COMPLEX]
type = "bool"
[parameters.PRINT_EIGENVECTORS]
type = "bool"
default = false
[parameters.MEASURE_ENERGY]
type = "bool"
default = true
[input.lattice_library]
type = "path"
[input.model_library]
type = "path"
[output.results]
type = "path"
required = true
# Diagonalization is deterministic and runs to completion.
[execution]
