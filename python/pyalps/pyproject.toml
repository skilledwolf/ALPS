[build-system]
# nanobind is capped below the next major: all extension modules in one
# process must agree on the nanobind ABI, and its API/ABI may break at
# major versions. Bump the cap deliberately, with a full test run.
requires = ["scikit-build-core>=1.0", "nanobind>=2.10,<3", "patchelf>=0.14; sys_platform == 'linux'"]
build-backend = "scikit_build_core.build"

[project]
name = "pyalps"
# Inherited from ALPS_VERSION.txt at the repository root, the same file
# cmake/ALPSVersion.cmake reads, so a release bump is one edit. A prerelease
# label comes from the ALPS_VERSION_PRERELEASE environment variable, matching
# how CMake takes it from the cache variable of that name. See
# _build_support/alps_version.py.
dynamic = ["version"]
description = "Python Applications and Libraries for Physics Simulations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.13"]
authors = [
  { name = "Sergei Iskakov", email = "siskakov@umich.edu" },
  { name = "Fei Lin", email = "feilin.physics@gmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://alps.comp-phys.org"
Repository = "https://github.com/ALPSim/ALPS"
Issues = "https://github.com/ALPSim/ALPS/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]
tests = ["pytest>=8", "coverage>=7", "pytest-benchmark>=5"]
mpi = ["mpi4py>=4"]

[[tool.dynamic-metadata]]
provider = { path = "_build_support", module = "alps_version" }

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/pyalps"]
wheel.py-api = "cp312"
wheel.force-include = { "LICENSE.txt" = "${SKBUILD_METADATA_DIR}/licenses/LICENSE.txt" }
build.verbose = true

[tool.scikit-build.cmake.define]
ALPS_DIR = { env = "ALPS_DIR" }

# Only shared release metadata comes from the repository root. All build code
# and binding sources belong to this package; solvers come from the installed SDK.
[tool.scikit-build.sdist.force-include]
"../../LICENSE.txt" = "LICENSE.txt"
# The version file, so an sdist build can still derive its own version.
"../../ALPS_VERSION.txt" = "ALPS_VERSION.txt"

[tool.cibuildwheel]
build = ["cp312-*"]
manylinux-x86_64-image = "manylinux_2_28"
test-requires = ["pytest", "ninja>=1.12", "nanobind>=2.10,<3", "scikit-build-core>=1.0"]
# An external watchdog can stop native code even while it holds Python's GIL.
test-command = 'python -c "import subprocess, sys; subprocess.run(sys.argv[1:], check=True, timeout=900)" pytest -v -o faulthandler_timeout=300 "{project}/tests/pyalps" "{project}/tests/cmake"'

# The ALPS C++ SDK is built once per platform in before-all via the distribution
# CMake preset; ALPS_DIR points every wheel build at that install. The ccache
# in _build/ccache spans the SDK and all wheel builds (cached across CI runs).
[tool.cibuildwheel.environment]
PIP_ONLY_BINARY = ":all:"
ALPS_DIR = "$(pwd)/_build/distribution/install/share/alps"
CMAKE_PREFIX_PATH = "$(pwd)/_build/boost-install"
CCACHE_DIR = "$(pwd)/_build/ccache"
CCACHE_NAMESPACE = "pyalps-wheel"
CMAKE_ARGS = "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
PYALPS_TEST_DOWNSTREAM_EXPORT = "1"

# The bundled XDR implementation uses portable C11 on glibc and musl.
[tool.cibuildwheel.linux]
environment-pass = ["GITHUB_REF", "ALPS_VERSION_PRERELEASE"]
before-all = [
  "if command -v dnf >/dev/null 2>&1; then dnf install -y ccache hdf5-devel lapack-devel; else apk add --no-cache boost-dev ccache hdf5-dev lapack-dev; export CXXFLAGS=-DALPS_NGS_NO_STACKTRACE; fi",
  "python -m pip install 'cmake>=4.3' 'ninja>=1.12'",
  "cd {project}",
  "cmake --preset distribution -DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
  "cmake --build --preset distribution -j2",
]
repair-wheel-command = [
  "python -m pip install wheel",
  # Boost's transitive libraries need the same search path as its direct ones.
  # Scope this to repair so installed-wheel tests cannot use the build prefix.
  'LD_LIBRARY_PATH="$(pwd)/_build/boost-install/lib" auditwheel repair -w {dest_dir} {wheel}',
  "python {project}/python/pyalps/_build_support/runtime_manifest.py --wheel {dest_dir}/*.whl",
  "auditwheel show {dest_dir}/*.whl",
]

[tool.cibuildwheel.macos]
before-all = [
  "brew install --force-bottle ccache cmake hdf5 ninja zstd xz",
  "cd {project}",
  "cmake --preset distribution -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DHDF5_ROOT=$(brew --prefix hdf5)",
  "cmake --build --preset distribution -j2",
]
repair-wheel-command = [
  "python -m pip install wheel",
  # Invoke the Python module directly: a shell shebang can strip DYLD variables.
  'DYLD_LIBRARY_PATH="$(pwd)/_build/boost-install/lib" python -m delocate.cmd.delocate_wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}',
  "python {project}/python/pyalps/_build_support/runtime_manifest.py --wheel {dest_dir}/*.whl",
  "delocate-listdeps --all {dest_dir}/*.whl",
]

[[tool.cibuildwheel.overrides]]
select = "*-macosx_*"
inherit.environment = "append"
environment = { CXXFLAGS = "-stdlib=libc++" }
