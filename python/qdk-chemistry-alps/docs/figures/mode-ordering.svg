<svg viewBox="0 0 600 292" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The interleaved ALPS mode ordering d(0) u(0) d(1) u(1) reordered into the blocked ordering u(0) u(1) d(0) d(1), with three line crossings, giving a sign of minus one.">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <style>
      #fig-modes .lbl  { font: 600 11px system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; fill: currentColor; }
      #fig-modes .sub  { font: 10.5px system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; fill: currentColor; opacity: .62; }
      #fig-modes .mode { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      #fig-modes .foot { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; fill: currentColor; opacity: .78; }
      #fig-modes .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      #fig-modes .u    { fill: #0e9384; }
      #fig-modes .d    { fill: #c2632a; }
      #fig-modes .bu   { fill: #0e9384; fill-opacity: .13; stroke: #0e9384; stroke-width: 1.2; }
      #fig-modes .bd   { fill: #c2632a; fill-opacity: .13; stroke: #c2632a; stroke-width: 1.2; }
      #fig-modes .wire { stroke: currentColor; stroke-width: 1.3; fill: none; opacity: .5; }
      #fig-modes .xing { fill: none; stroke: #c2632a; stroke-width: 1.6; }
      #fig-modes .rule { stroke: currentColor; opacity: .16; stroke-width: 1; }
    </style>
  </defs>
  <g id="fig-modes">
    <text class="lbl" x="10" y="30">ALPS</text>
    <text class="sub" x="10" y="46">interleaved —</text>
    <text class="sub" x="10" y="60">down before up</text>

    <rect class="bd" x="190" y="16" width="82" height="32" rx="5"/>
    <text class="mode d" x="231" y="37" text-anchor="middle">d(0)</text>
    <rect class="bu" x="284" y="16" width="82" height="32" rx="5"/>
    <text class="mode u" x="325" y="37" text-anchor="middle">u(0)</text>
    <rect class="bd" x="378" y="16" width="82" height="32" rx="5"/>
    <text class="mode d" x="419" y="37" text-anchor="middle">d(1)</text>
    <rect class="bu" x="472" y="16" width="82" height="32" rx="5"/>
    <text class="mode u" x="513" y="37" text-anchor="middle">u(1)</text>

    <path class="wire" d="M231 52 C231 112, 419 132, 419 196"/>
    <path class="wire" d="M325 52 C325 112, 231 132, 231 196"/>
    <path class="wire" d="M419 52 C419 112, 513 132, 513 196"/>
    <path class="wire" d="M513 52 C513 112, 325 132, 325 196"/>

    <g class="xing">
      <circle cx="281" cy="120" r="8"/>
      <circle cx="384" cy="132" r="8"/>
      <circle cx="466" cy="120" r="8"/>
    </g>

    <text class="lbl" x="10" y="212">qdk-chemistry · PySCF</text>
    <text class="sub" x="10" y="228">blocked —</text>
    <text class="sub" x="10" y="242">all alpha, then all beta</text>

    <rect class="bu" x="190" y="200" width="82" height="32" rx="5"/>
    <text class="mode u" x="231" y="221" text-anchor="middle">u(0)</text>
    <rect class="bu" x="284" y="200" width="82" height="32" rx="5"/>
    <text class="mode u" x="325" y="221" text-anchor="middle">u(1)</text>
    <rect class="bd" x="378" y="200" width="82" height="32" rx="5"/>
    <text class="mode d" x="419" y="221" text-anchor="middle">d(0)</text>
    <rect class="bd" x="472" y="200" width="82" height="32" rx="5"/>
    <text class="mode d" x="513" y="221" text-anchor="middle">d(1)</text>

    <line class="rule" x1="10" y1="258" x2="590" y2="258"/>
    <text class="foot" x="10" y="274">
      <tspan class="mono" style="fill:#c2632a">3 crossings</tspan>
      <tspan> — an odd number of transpositions, so the coefficient changes sign.</tspan>
    </text>
    <text class="foot" x="10" y="288">
      <tspan class="mono">interleaved_to_blocked_parity(alpha, beta)</tspan>
      <tspan> returns −1.</tspan>
    </text>
  </g>
</svg>
