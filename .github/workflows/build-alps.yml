name: Build ALPS (reusable)

on:
  workflow_call:
    inputs:
      tier:
        description: "Matrix slice: quick or full"
        required: true
        type: string
      max_parallel:
        description: "Maximum source builds allowed to run concurrently"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: source-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tier }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Select ${{ inputs.tier }} matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
      cache_epoch: ${{ steps.pick.outputs.cache_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/ci-matrix
      - id: pick
        name: Select matrix entries
        env:
          TIER: ${{ inputs.tier }}
        run: |
          case "$TIER" in
            quick|full) ;;
            *) echo "Unsupported tier: $TIER" >&2; exit 2 ;;
          esac
          platforms="$(jq -sc --arg tier "$TIER" \
            '[.[][] | select($tier == "full" or .tier == "quick") | del(.tier)]' \
            .github/ci-matrix/linux.json .github/ci-matrix/macos.json)"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "cache_epoch=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.plat.label }}
    needs: matrix
    runs-on: ${{ matrix.plat.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        plat: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 150M
      PLATFORM: ${{ matrix.plat.platform }}
      COMP_PACK: ${{ matrix.plat.comp_pack }}
      C_COMPILER: ${{ matrix.plat.c_compiler }}
      CXX_COMPILER: ${{ matrix.plat.cxx_compiler }}
      C_VERSION: ${{ matrix.plat.c_version }}
      CXX_STANDARD: ${{ matrix.plat.cxx_standard }}
      NUMPY_SPEC: ${{ matrix.plat.numpy_spec }}
      BOOST_VERSION: ${{ matrix.plat.boost_version }}
      BOOST_SHA256: ${{ matrix.plat.boost_sha256 }}
      SANITIZE: ${{ matrix.plat.sanitize }}
      PERMISSIVE: ${{ matrix.plat.permissive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.plat.py_version }}
          allow-prereleases: ${{ matrix.plat.allow_prereleases }}

      - name: Restore Boost archive
        id: boost-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          key: boost-src-${{ runner.os }}-1.${{ matrix.plat.boost_version }}.0-${{ matrix.plat.boost_sha256 }}

      - name: Restore compiled objects
        id: ccache
        if: matrix.plat.remote_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ matrix.plat.label }}-${{ needs.matrix.outputs.cache_epoch }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ matrix.plat.label }}-

      - name: Install Linux dependencies
        if: matrix.plat.platform == 'linux'
        timeout-minutes: 20
        run: bash .github/scripts/install-linux-deps.sh

      - name: Install macOS dependencies
        if: matrix.plat.platform == 'macos'
        timeout-minutes: 30
        run: bash .github/scripts/install-macos-deps.sh

      - name: Save Boost archive
        if: >-
          github.ref == 'refs/heads/master' &&
          steps.boost-cache.outputs.cache-hit != 'true' &&
          (matrix.plat.label == 'minimums' ||
           matrix.plat.label == 'gcc-current' ||
           matrix.plat.label == 'macos-15-arm')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          key: boost-src-${{ runner.os }}-1.${{ matrix.plat.boost_version }}.0-${{ matrix.plat.boost_sha256 }}

      - name: Configure and build
        run: bash .github/scripts/build-alps.sh

      - name: Run tests
        run: bash .github/scripts/run-tests.sh

      - name: Test summary
        if: always()
        run: python .github/scripts/junit-summary.py build/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-${{ matrix.plat.label }}-${{ github.run_id }}
          path: |
            build/Testing/Temporary/**
            build/junit.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Save compiled objects
        if: >-
          always() && matrix.plat.remote_cache &&
          github.ref == 'refs/heads/master' &&
          steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ matrix.plat.label }}-${{ needs.matrix.outputs.cache_epoch }}
