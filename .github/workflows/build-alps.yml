name: Build ALPS (reusable)

# Reusable build workflow. Callers pick a tier:
#   quick — matrix entries tagged "quick" in .github/ci-matrix/*.json (PR gate)
#   full  — every matrix entry (weekly sweep / manual dispatch)
# See .github/ci-matrix/README.md for the tiering rationale.

on:
  workflow_call:
    inputs:
      tier:
        description: "Matrix slice to run: 'quick' or 'full'"
        required: true
        type: string

jobs:
  matrix:
    name: Select ${{ inputs.tier }} matrix
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci-matrix
      - id: pick
        run: |
          for plat in linux macos; do
            echo "$plat=$(jq -c --arg tier "${{ inputs.tier }}" \
              '[.[] | select($tier == "full" or .tier == "quick") | del(.tier)]' \
              .github/ci-matrix/$plat.json)" >> "$GITHUB_OUTPUT"
          done

  linux-build:
    name: Linux ${{ matrix.plat.label }}
    needs: matrix
    runs-on: ${{ matrix.plat.os }}
    # Worst observed healthy job is ~60 min cold; a hang otherwise burns the
    # 6-hour GitHub default.
    timeout-minutes: 90
    # Experimental entries (sanitizers, canaries, no-fpermissive) report
    # failures without failing the run.
    continue-on-error: ${{ matrix.plat.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(needs.matrix.outputs.linux) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.plat.py_version }}
      - name: Cache Boost sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          key: boost-src-1.${{ matrix.plat.boost_version }}.0
      - name: Cache compiled objects (ccache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.plat.label }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.plat.label }}-
      - name: Install dependencies
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "scipy>=1.13"
          sudo apt install ccache liblapack-dev libblas-dev libopenmpi-dev libhdf5-serial-dev
          # Clang >= 19: not in Ubuntu's default apt repos; use apt.llvm.org.
          # GCC >= 15: not in Ubuntu's default apt repos; use ubuntu-toolchain-r PPA.
          if [[ "${{ matrix.plat.c_compiler }}" == "clang" && "${{ matrix.plat.c_version }}" -ge 19 ]]; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ matrix.plat.c_version }} all
          else
            if [[ "${{ matrix.plat.c_compiler }}" == "gcc" && "${{ matrix.plat.c_version }}" -ge 15 ]]; then
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
            fi
            sudo apt install ${{ matrix.plat.comp_pack }}
          fi
          if [[ ! -f boost_1_${{ matrix.plat.boost_version }}_0.tar.gz ]]; then
            wget -nv --tries=3 --timeout=60 --waitretry=10 https://archives.boost.io/release/1.${{ matrix.plat.boost_version }}.0/source/boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          fi
          tar -xzf boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
      - name: Build ALPS
        env:
          CC:  ${{ matrix.plat.c_compiler }}-${{ matrix.plat.c_version }}
          CXX: ${{ matrix.plat.cxx_compiler }}-${{ matrix.plat.c_version }}
        run: |
          # Per-entry extras: sanitizers, and the no-fpermissive canary.
          EXTRA_CXX=""
          LINKER=""
          if [[ -n "${{ matrix.plat.sanitize }}" ]]; then
            EXTRA_CXX="-fsanitize=${{ matrix.plat.sanitize }} -fno-sanitize-recover=all -fno-omit-frame-pointer"
            LINKER="-fsanitize=${{ matrix.plat.sanitize }}"
          fi
          PERMISSIVE="-fpermissive"
          if [[ "${{ matrix.plat.permissive }}" == "false" ]]; then
            PERMISSIVE=""
          fi
          cmake -S $GITHUB_WORKSPACE -B build \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DBoost_ROOT_DIR=`pwd`/boost_1_${{ matrix.plat.boost_version }}_0 \
                -DCMAKE_CXX_STANDARD=${{ matrix.plat.cxx_standard || '17' }} \
                -DCMAKE_CXX_FLAGS="$PERMISSIVE -DBOOST_NO_AUTO_PTR -DBOOST_FILESYSTEM_NO_CXX20_ATOMIC_REF -DBOOST_TIMER_ENABLE_DEPRECATED $EXTRA_CXX" \
                -DCMAKE_EXE_LINKER_FLAGS="$LINKER" \
                -DCMAKE_SHARED_LINKER_FLAGS="$LINKER" \
                -DCMAKE_MODULE_LINKER_FLAGS="$LINKER"
          cmake --build build -j $(nproc)
          ccache -s
      - name: Run tests
        run: |
          if [[ "${{ matrix.plat.sanitize }}" == *address* ]]; then
            # Sanitized extension modules loaded by an unsanitized python
            # need the ASan runtime preloaded. Leak detection is off until
            # the (large) existing leak backlog is triaged.
            export LD_PRELOAD=$(${{ matrix.plat.c_compiler }}-${{ matrix.plat.c_version }} -print-file-name=libasan.so)
            export ASAN_OPTIONS=detect_leaks=0
          fi
          export UBSAN_OPTIONS=print_stacktrace=1
          ctest --test-dir build --output-on-failure --output-junit junit.xml
      - name: Test summary
        if: always()
        run: python3 .github/scripts/junit-summary.py build/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-logs-linux-${{ matrix.plat.label }}-${{ github.run_id }}
          path: |
            build/Testing/Temporary/**
            build/junit.xml

  macos-build:
    name: macOS ${{ matrix.plat.label }}
    needs: matrix
    runs-on: ${{ matrix.plat.os }}
    # Intel runners are slow and variable; worst observed healthy job ~85 min.
    timeout-minutes: 120
    continue-on-error: ${{ matrix.plat.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(needs.matrix.outputs.macos) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache Boost sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          key: boost-src-1.${{ matrix.plat.boost_version }}.0
      - name: Cache compiled objects (ccache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.plat.label }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.plat.label }}-
      - name: Install dependencies
        run: |
          brew install ccache python@${{ matrix.plat.py_version }} gfortran
          pip${{ matrix.plat.py_version }} install "numpy>=1.26" "scipy>=1.13" --break-system-packages
          brew install openmpi hdf5
          if [[ -n "${{ matrix.plat.comp_pack }}" ]]; then
            brew install ${{ matrix.plat.comp_pack }}
          fi
          if [[ ! -f boost_1_${{ matrix.plat.boost_version }}_0.tar.gz ]]; then
            wget -nv --tries=3 --timeout=60 --waitretry=10 https://archives.boost.io/release/1.${{ matrix.plat.boost_version }}.0/source/boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          fi
          tar -xzf boost_1_${{ matrix.plat.boost_version }}_0.tar.gz
          ln -sf $(brew --prefix)/bin/python${{ matrix.plat.py_version }} $(brew --prefix)/bin/python
      - name: Build ALPS
        env:
          FC: gfortran
        run: |
          cmake -S $GITHUB_WORKSPACE -B build \
                -DCMAKE_C_COMPILER=${{ matrix.plat.c_compiler }} \
                -DCMAKE_CXX_COMPILER=${{ matrix.plat.cxx_compiler }} \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DBoost_ROOT_DIR=`pwd`/boost_1_${{ matrix.plat.boost_version }}_0 \
                -DCMAKE_CXX_STANDARD=${{ matrix.plat.cxx_standard || '17' }} \
                -DCMAKE_CXX_FLAGS="${{ matrix.plat.cxx_stdlib }} -fpermissive -DBOOST_NO_AUTO_PTR -DBOOST_FILESYSTEM_NO_CXX20_ATOMIC_REF -DBOOST_TIMER_ENABLE_DEPRECATED" \
                -DPython_ROOT_DIR=`$(brew --prefix)/bin/python${{ matrix.plat.py_version }} -c "import sys, os; print(os.path.dirname(os.path.dirname(str(sys.executable))));"` \
                -DCMAKE_Fortran_COMPILER=gfortran
          cmake --build build -j $(sysctl -n hw.ncpu)
          ccache -s
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --output-junit junit.xml
      - name: Test summary
        if: always()
        run: python3 .github/scripts/junit-summary.py build/junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-logs-macos-${{ matrix.plat.label }}-${{ github.run_id }}
          path: |
            build/Testing/Temporary/**
            build/junit.xml
