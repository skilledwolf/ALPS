name: ALPS Python Packaging CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: ':all:'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install packaging pytest "scikit-build-core>=1.0" "cmake>=4.3" ninja
      - name: Test release validation
        run: python -m pytest tests/packaging -q
      - name: Check package, SDK, and tag versions
        run: python .github/scripts/check_release_version.py

  build_wheels:
    name: Build wheels / ${{ matrix.plat.family }}
    needs: [check_version]
    runs-on: ${{ matrix.plat.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        plat:
        - { os: ubuntu-latest, target: "", arch: x86_64, family: manylinux, build: 'cp312-manylinux*' }
        - { os: ubuntu-latest, target: "", arch: x86_64, family: musllinux, build: 'cp312-musllinux*' }
        - { os: macos-15, target: "15.0", arch: arm64, family: macos, build: 'cp312-macosx*' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Download pinned Boost binaries
        shell: bash
        env:
          FAMILY: ${{ matrix.plat.family }}
        run: |
          boost=$(python -c 'import json; print(json.load(open(".github/ci-matrix.json"))["boost_default"])')
          if [[ "$RUNNER_OS" == Linux ]]; then
            if [[ "$FAMILY" == musllinux ]]; then
              image=$(python -c 'import json; print(json.load(open(".github/dependencies.json"))["musllinux_image"])')
              echo "CIBW_MUSLLINUX_X86_64_IMAGE=$image" >> "$GITHUB_ENV"
              # Alpine supplies Boost as a binary package inside the container.
              exit 0
            fi
            platform=manylinux-x64
            image=$(python -c 'import json; print(json.load(open(".github/dependencies.json"))["manylinux_image"])')
            echo "CIBW_MANYLINUX_X86_64_IMAGE=$image" >> "$GITHUB_ENV"
          else
            platform=macos-arm64
          fi
          python .github/scripts/ci_dependencies.py "boost-$boost-$platform" _build/boost-install

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/ccache
          key: pyalps-ccache-${{ matrix.plat.family }}-${{ matrix.plat.arch }}-${{ hashFiles('src/**', 'third_party/**', 'python/pyalps/**') }}
          restore-keys: pyalps-ccache-${{ matrix.plat.family }}-${{ matrix.plat.arch }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: python/pyalps
        env:
          # The wheel build is configured in [tool.cibuildwheel] in
          # python/pyalps/pyproject.toml and the distribution preset in
          # CMakePresets.json; only matrix-derived values live here.
          CIBW_ARCHS: ${{ matrix.plat.arch }}
          CIBW_BUILD: ${{ matrix.plat.build }}
          # cibuildwheel copies /project; mount the compiler cache explicitly
          # so Linux builds update the directory that Actions saves afterward.
          CIBW_CONTAINER_ENGINE: 'docker; create_args: --volume "${{ github.workspace }}/_build/ccache:/project/_build/ccache"'
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.plat.target }}

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl


  windows_wheels:
    name: Windows ${{ matrix.architecture }} wheel
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    uses: ./.github/workflows/windows.yml
    with:
      architecture: ${{ matrix.architecture }}
      configuration: Release
      wheel: true

  build_sdist:
    name: Build source distribution
    needs: [check_version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build sdist
        run: pipx run build --sdist --outdir dist python/pyalps

      # The sdist must remain buildable outside the repository checkout:
      # verify its metadata and Python-owned sources. Solver implementations
      # belong to the installed C++ SDK and must not be vendored here.
      - name: Smoke check sdist
        run: |
          pipx run twine check dist/*.tar.gz
          tar -tzf dist/*.tar.gz > sdist-manifest.txt
          for path in cpp/maxent_c.cpp cpp/cthyb.cpp cpp/ctint.cpp \
                      cpp/params.cpp cpp/hdf5.cpp cpp/extract_from_pyobject.hpp \
                      LICENSE.txt src/pyalps/__init__.py src/pyalps/__main__.py \
                      _build_support/pyalpsConfig.cmake \
                      cpp/export_simulation.hpp; do
            grep -q "$path" sdist-manifest.txt || { echo "missing $path in sdist"; exit 1; }
          done
          if grep -q '/_vendor/' sdist-manifest.txt; then
            echo "sdist contains vendored C++ SDK sources"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz


  # cibuildwheel already runs tests/pyalps against every wheel inside the build
  # environment; this job checks the artifacts as they would reach PyPI: the
  # repaired, uploaded-and-downloaded wheel installed with pip on a clean
  # runner, using the same abi3 wheel on every supported Python version.
  smoke_test:
    name: Smoke test wheels on ${{ matrix.plat.os }} / py${{ matrix.python }}
    needs: [build_wheels, windows_wheels]
    runs-on: ${{ matrix.plat.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plat:
          - { os: ubuntu-latest, architecture: x64, artifact: cibw-wheels-ubuntu-latest-* }
          - { os: macos-15, architecture: arm64, artifact: cibw-wheels-macos-15-* }
          # The macOS 15 deployment target is forward-compatible; test that
          # wheel on the newest runner rather than publishing a second copy.
          - { os: macos-26, architecture: arm64, artifact: cibw-wheels-macos-15-* }
          - { os: windows-latest, architecture: x64, artifact: cibw-wheels-windows-x64 }
          - { os: windows-11-arm, architecture: arm64, artifact: cibw-wheels-windows-arm64 }
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.plat.architecture }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.plat.artifact }}
          path: wheelhouse
          merge-multiple: true

      - name: Install validation requirements
        run: python -m pip install twine numpy scipy pytest h5py

      - name: Check wheel metadata
        run: python -m twine check wheelhouse/*.whl

      - name: Install wheel from artifacts
        run: python -m pip install --no-index --find-links wheelhouse pyalps

      - name: Import and run binding surface tests
        run: |
          python .github/scripts/validate_pyalps.py --output _build/validation --wheelhouse wheelhouse

      - name: Retain installed-wheel validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyalps-validation-${{ matrix.plat.os }}-py${{ matrix.python }}
          path: _build/validation

      - name: Summarize wheel tests
        if: always()
        run: python .github/scripts/junit_summary.py _build/validation/pytest.xml

  # The ordinary wheel tests deliberately keep mpi4py optional. This job
  # installs one consistent Open MPI stack and verifies real inter-rank
  # collectives, requests and point-to-point traffic through pyalps.mpi.
  mpi_smoke:
    name: Smoke test MPI adapter with two ranks
    needs: [build_wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cibw-wheels-ubuntu-latest-*
          path: wheelhouse
          merge-multiple: true

      - name: Install wheel and MPI runtime
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
          python -m pip install numpy scipy pytest mpi4py
          python -m pip install --no-index --find-links wheelhouse pyalps

      - name: Run two-rank compatibility surface
        run: mpiexec -n 2 python -m pytest -q tests/pyalps/test_binding_surface.py::test_mpi4py_compatibility_surface tests/pyalps/test_mpi_requests.py

  upload_pypi:
    needs: [build_wheels, windows_wheels, build_sdist, smoke_test, mpi_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Check every distribution before publishing
        run: python .github/scripts/check_release_version.py --dist dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
