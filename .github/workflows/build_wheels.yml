name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Verify release tag and package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/check-release-version.py "$RELEASE_TAG"
      - name: Build and verify source distribution
        run: |
          python -m pip install "build==1.5.0" "twine==7.0.0"
          python -m build --sdist
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Wheels ${{ matrix.platform.os }} ${{ matrix.platform.arch }}
    needs: sdist
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        platform:
          - { os: ubuntu-latest, arch: x86_64, target: '' }
          - { os: ubuntu-24.04-arm, arch: aarch64, target: '' }
          - { os: macos-15, arch: arm64, target: '15.0' }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sdist
          path: dist
      - id: sdist
        name: Locate source distribution
        shell: bash
        run: |
          path="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.platform.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.platform.arch }}
          CIBW_ENVIRONMENT: "FC=gfortran"
          CIBW_ENVIRONMENT_MACOS: >-
            FC=gfortran
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.platform.target }}
            CXXFLAGS="-stdlib=libc++"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-wheels-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify release artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Check metadata and list hashes
        run: |
          python -m pip install "twine==7.0.0"
          python -m twine check dist/*
          sha256sum dist/*

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [sdist, wheels, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Required only here for PyPI Trusted Publishing via OIDC.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          verify-metadata: true
          attestations: true
