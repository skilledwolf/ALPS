name: ALPS Python Packaging CI/CD

# PRs build a single smoke-test wheel (one platform, one Python) to verify
# packaging isn't broken. The full wheel matrix — all platforms x CPython
# 3.10-3.13 — runs on release tags and manual dispatch, and publishing to
# PyPI stays gated on 'v*' tags.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Select wheel matrix
    runs-on: ubuntu-latest
    outputs:
      plat: ${{ steps.pick.outputs.plat }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR smoke test: newest CPython on Linux only.
            echo 'plat=[{"os":"ubuntu-latest","target":"","arch":"x86_64","homebrew":"","cibw_build":"cp313-*"}]' >> "$GITHUB_OUTPUT"
          else
            # Full matrix for tags / manual dispatch.
            full='[
              {"os":"ubuntu-latest","target":"","arch":"x86_64","homebrew":"","cibw_build":"cp310-* cp311-* cp312-* cp313-*"},
              {"os":"macos-15","target":"15.0","arch":"arm64","homebrew":"/opt/homebrew","cibw_build":"cp310-* cp311-* cp312-* cp313-*"},
              {"os":"macos-26","target":"26.0","arch":"arm64","homebrew":"/opt/homebrew","cibw_build":"cp310-* cp311-* cp312-* cp313-*"}
            ]'
            echo "plat=$(jq -c . <<< "$full")" >> "$GITHUB_OUTPUT"
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.plat.os }}
    needs: matrix
    runs-on: ${{ matrix.plat.os }}
    strategy:
      fail-fast: false
      matrix:
        plat: ${{ fromJSON(needs.matrix.outputs.plat) }}
    steps:
      - uses: actions/checkout@v7

      # Install Fortran compiler based on OS
      - name: Install dependencies
        run: |
          if [ "${{ matrix.plat.os }}" = "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y gfortran
          else
            brew update
            brew install gfortran
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: ${{ matrix.plat.cibw_build }}
          CIBW_ARCHS: ${{ matrix.plat.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.plat.arch }}

          # Set Fortran compiler for all platforms
          CIBW_ENVIRONMENT: "FC=gfortran"

          # macOS-specific settings
          CIBW_ENVIRONMENT_MACOS: >
            Boost_ROOT_DIR=/Users/runner/work/ALPS/ALPS/boost_1_87_0
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.plat.target }}
            CXXFLAGS="-stdlib=libc++"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl


  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz


  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v')  || github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
