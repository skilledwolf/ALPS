name: Compatibility

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compatibility builds
    uses: ./.github/workflows/build-alps.yml
    with:
      tier: full
      max_parallel: 6
