name: Full build matrix

# The exhaustive sweep: every compiler, Boost, Python, and C++ standard in
# .github/ci-matrix/*.json (~39 jobs). Runs weekly to catch ecosystem drift
# (new compiler/Boost/Python releases) and on demand for risky changes —
# trigger it on any branch with:
#   gh workflow run full-matrix.yml --ref <branch>
# PRs are gated by the small "quick" tier in ci.yml instead.

on:
  schedule:
    - cron: '30 5 * * 1'   # 05:30 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-alps.yml
    with:
      tier: full
