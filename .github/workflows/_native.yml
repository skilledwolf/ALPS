name: Native build and SDK checks
'on':
  workflow_call:
    inputs:
      os:
        type: string
        default: ubuntu-24.04
      cc:
        type: string
        default: gcc
      cxx:
        type: string
        default: g++
      python:
        type: string
        default: '3.12'
      cmake:
        type: string
        default: cmake>=3.27
      cmake-args:
        type: string
        default: ''
      mpi:
        type: boolean
        default: false
      bindings:
        type: boolean
        default: false
      native-tests:
        type: boolean
        default: true
      test-label:
        type: string
        default: .
      minimum-boost:
        type: boolean
        default: false
      extras:
        type: boolean
        default: false
      cache:
        type: boolean
        default: false
      name:
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      CC: ${{ inputs.cc }}
      CXX: ${{ inputs.cxx }}
      CMAKE_REQUIREMENT: ${{ inputs.cmake }}
      CMAKE_ARGS: ${{ inputs.cmake-args }}
      ENABLE_MPI: ${{ inputs.mpi && 'ON' || 'OFF' }}
      NATIVE_TESTS: ${{ inputs.native-tests && 'ON' || 'OFF' }}
      APPLICATIONS: ${{ (inputs.bindings || inputs.extras) && 'ON' || 'OFF' }}
      TEST_LABEL: ${{ inputs.test-label }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ (startsWith(inputs.os, 'macos-') || contains(inputs.cmake-args, 'EXTENSIVE_TESTS=ON')) && '2' || '4' }}
      CTEST_PARALLEL_LEVEL: 2
      CMAKE_GENERATOR: Ninja
      ALPS_DIR: ${{ github.workspace }}/_build/ci/install/share/alps
      CMAKE_C_COMPILER_LAUNCHER: ${{ inputs.cache && 'ccache' || '' }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ inputs.cache && 'ccache' || '' }}
      CCACHE_DIR: ${{ github.workspace }}/_build/ccache
      CCACHE_MAXSIZE: 256M
      PIP_ONLY_BINARY: ':all:'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ inputs.python }}
    - name: Install binary dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-all-dev libgtest-dev libhdf5-dev libblas-dev liblapack-dev libopenmpi-dev openmpi-bin ccache gfortran xsltproc
        if [[ "$CC" == gcc-14 ]]; then sudo apt-get install -y gcc-14 g++-14; fi
        python -m pip install "$CMAKE_REQUIREMENT" ninja pytest numpy h5py
    - name: Install binary dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install --force-bottle boost googletest hdf5 openblas ccache
        echo "CMAKE_PREFIX_PATH=$(brew --prefix boost):$(brew --prefix hdf5):$(brew --prefix openblas)" >> "$GITHUB_ENV"
        python -m pip install "$CMAKE_REQUIREMENT" ninja pytest numpy h5py
    - name: Build the minimum supported Boost
      if: inputs.minimum-boost
      env:
        ALPS_BOOST_MPI: 'OFF'
      run: |
        python -m pip install numpy==1.26.0
        python -m pytest tests/tutorials -q --junitxml=_build/tutorial-floor.xml
        python .github/scripts/prepare_dependencies.py boost-1.76.0 _build/boost-install
        echo "CMAKE_PREFIX_PATH=$PWD/_build/boost-install" >> "$GITHUB_ENV"
    - name: Identify compiler and dependency ABI
      if: inputs.cache
      id: toolchain
      run: |
        {
          "$CXX" --version
          echo "$ImageVersion $CMAKE_ARGS $ENABLE_MPI"
          if [[ "$RUNNER_OS" == Linux ]]; then
            dpkg-query -W 'libboost*' 'libhdf5*' 'libopenmpi*'
          else
            brew list --versions boost hdf5 openblas
          fi
        } > "$RUNNER_TEMP/toolchain"
        python - <<'CODE'
        import hashlib, os
        from pathlib import Path
        key = hashlib.sha256((Path(os.environ['RUNNER_TEMP']) / 'toolchain').read_bytes()).hexdigest()
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            print('key=' + key, file=out)
        CODE
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: inputs.cache
      id: cache
      with:
        path: _build/ccache
        key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ github.run_id }}-${{
          github.run_attempt }}
        restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
    - name: Configure and build
      run: |
        read -r -a args <<< "$CMAKE_ARGS"
        cmake --preset default -B _build/ci \
          -DCMAKE_INSTALL_PREFIX="$PWD/_build/ci/install" \
          -DCMAKE_CXX_STANDARD=17 \
          -DALPS_BUILD_TESTING="$NATIVE_TESTS" -DALPS_BUILD_APPLICATIONS="$APPLICATIONS" \
          -DALPS_ENABLE_MPI="$ENABLE_MPI" -DMPIEXEC_PREFLAGS=--oversubscribe \
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF "${args[@]}"
        cmake --build _build/ci
    - name: Test native behavior
      if: inputs.native-tests
      run: |
        ctest --test-dir _build/ci -L "$TEST_LABEL" -LE '^mpi$' --output-on-failure --output-junit ctest.xml --no-tests=error
    - name: Test two- and three-rank native MPI
      if: inputs.mpi
      run: ctest --test-dir _build/ci -L '^mpi$' --output-on-failure --output-junit mpi.xml --no-tests=error
    - name: Install the SDK
      run: cmake --install _build/ci
    - name: Test installed SDK consumers and relocation
      if: '!inputs.bindings'
      run: |
        python -m pytest tests/cmake/test_sdk_contracts.py -q \
          -k 'installed_sdk_preserves_parent_settings or relocated_sdk' --junitxml=_build/ci/sdk.xml
    - name: Test editable bindings and complete SDK contracts
      if: inputs.bindings
      env:
        PYALPS_TEST_DOWNSTREAM_EXPORT: '1'
      run: |
        python -m pip install build 'nanobind==2.15.0' 'scikit-build-core>=1.0' numpy scipy matplotlib lxml h5py
        if [[ "$ENABLE_MPI" == ON ]]; then python -m pip install mpi4py; fi
        if [[ "$RUNNER_OS" == Linux ]]; then python -m pip install patchelf; fi
        python -m pip install --no-build-isolation --no-deps -e python/pyalps --config-settings "build-dir=$PWD/_build/python"
        python .github/scripts/run_with_timeout.py 900 python -m pytest tests/pyalps tests/cmake -v --capture=tee-sys --junitxml=_build/ci/python.xml
    - name: Test Python MPI communication
      if: inputs.bindings && inputs.mpi
      run: |
        python .github/scripts/run_with_timeout.py 300 mpiexec --oversubscribe -n 2 \
          python .github/scripts/run_mpi_pytest.py --ranks 2 --output _build/mpi \
          tests/pyalps/test_binding_surface.py::test_mpi4py_compatibility_surface tests/pyalps/test_mpi_requests.py
    - name: Test installed XML tools after relocation
      if: inputs.extras
      env:
        ALPS_XML_BUILD: _build/ci
      run: python -m pytest tests/cli -q --junitxml=_build/ci/cli.xml
    - name: Build installed C, C++ and Fortran tutorials
      if: inputs.extras
      run: |
        cmake --install _build/ci
        cmake --install _build/ci --component tutorials
        tutorials="$PWD/_build/ci/install/share/alps/tutorials"
        for source in "$tutorials/00-examples" "$tutorials/00-examples/fortran"; do
          output="_build/consumers/${source#"$tutorials/"}"
          cmake -S "$source" -B "$output" -G Ninja \
            "-DALPS_DIR=$PWD/_build/ci/install/share/alps"
          cmake --build "$output"
          ctest --test-dir "$output" --output-on-failure --output-junit ctest.xml --no-tests=error
        done
        find "$tutorials" -mindepth 1 -path "$tutorials/00-examples" -prune -o -name CMakeLists.txt -print0 | while IFS= read -r -d '' file; do
          source="${file%/CMakeLists.txt}"
          # The root file installs tutorials; it is not a tutorial project.
          if [[ "$source" == "$tutorials" ]]; then continue; fi
          output="_build/consumers/${source#"$tutorials/"}"
          cmake -S "$source" -B "$output" -G Ninja \
            "-DALPS_DIR=$PWD/_build/ci/install/share/alps"
          cmake --build "$output"
          ctest --test-dir "$output" --output-on-failure --output-junit ctest.xml
        done
    - name: Compiler cache statistics
      if: always() && inputs.cache
      run: ccache --show-stats --verbose
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: '!cancelled() && inputs.cache && steps.cache.outcome == ''success'' && (github.event_name != ''pull_request''
        || github.event.pull_request.head.repo.full_name == github.repository)'
      with:
        path: _build/ccache
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Summarize tests
      if: always()
      run: python .github/scripts/junit_summary.py '_build/ci/*.xml' '_build/mpi/*.xml' _build/tutorial-floor.xml
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: native-${{ inputs.name }}
        path: |
          _build/ci/*.xml
          _build/mpi/*.xml
          _build/ci/Testing/Temporary/**
          _build/tutorial-floor.xml
