name: Simulation Help Router

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  route:
    name: Label and assign simulation question
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # Required to create labels and route the opened issue.
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/(?:^|\n)### Method\s*\n+([^\n]+)/i);
            const method = match ? match[1].trim() : 'Other (please specify in additional context)';

            const routes = {
              'Exact Diagonalization (ED)': {
                assignee: 'vws100', label: 'method:ed', color: '1d76db'
              },
              'Quantum Monte Carlo (SSE)': {
                assignee: 'wistaria', label: 'method:sse', color: '0e8a16'
              },
              'Quantum Monte Carlo (Worm)': {
                assignee: 'LodePollet', label: 'method:worm', color: '0e8a16'
              },
              'Density Matrix Renormalization Group (DMRG)': {
                assignee: 'afeiguin', label: 'method:dmrg', color: '5319e7'
              },
              'Dynamical Mean Field Theory (DMFT)': {
                assignee: 'egull', label: 'method:dmft', color: 'b60205'
              },
              'Other (please specify in additional context)': {
                assignee: 'Ooolab', label: 'method:other', color: '6a737d'
              }
            };
            const route = routes[method] || routes['Other (please specify in additional context)'];
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;

            try {
              await github.rest.issues.getLabel({owner, repo, name: route.label});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: route.label, color: route.color,
                description: `Simulation help using ${method}`
              });
            }
            await github.rest.issues.addLabels({owner, repo, issue_number, labels: [route.label]});

            try {
              await github.request('GET /repos/{owner}/{repo}/assignees/{assignee}', {
                owner, repo, assignee: route.assignee
              });
              await github.rest.issues.addAssignees({
                owner, repo, issue_number, assignees: [route.assignee]
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice(`${route.assignee} is not assignable in ${owner}/${repo}; applied ${route.label} instead.`);
            }
