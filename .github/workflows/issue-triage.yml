name: Simulation Help Router

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  route_by_method:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Method from the issue form
        id: route
        run: python3 .github/scripts/route_issue.py

      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ steps.route.outputs.assignee }}
        run: gh issue edit "$ISSUE_NUMBER" --add-assignee "$ASSIGNEE"
