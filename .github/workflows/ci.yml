name: CI

# PR gate: the "quick" tier of the build matrix (~9 jobs covering the
# boundaries of every axis). The exhaustive sweep runs weekly and on demand
# via full-matrix.yml. See .github/ci-matrix/README.md.
#
# NOTE for branch protection: if the "Linux …" / "macOS …" checks are made
# required, a paths-ignore skip leaves them in "Expected" state and blocks
# merging. Keep the ignore list to files that can never affect the build.

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:

permissions:
  contents: read

# Newest wins: a superseded run tests a stale commit, so cancel it — on PR
# branches and master alike. (An expression here is a trap: it yields the
# string "false", which GitHub treats as truthy.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          # shellcheck style findings in the inherited build scripts are
          # tracked separately; lint the workflow structure strictly.
          args: -color -ignore shellcheck

  build:
    name: Build
    uses: ./.github/workflows/build-alps.yml
    with:
      tier: quick
