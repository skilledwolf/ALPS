# Shared implementation; source and packaging workflows own the triggers.
name: Windows SDK and wheel
on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      configuration:
        type: string
        required: true
      wheel:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  msvc:
    name: MSVC ${{ inputs.architecture }} ${{ inputs.configuration }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/_build/dependencies
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          architecture: ${{ inputs.architecture }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ inputs.architecture }}
      - name: Download pinned dependency SDK
        run: python .github/scripts/ci_dependencies.py windows-${{ inputs.architecture }} _build/dependencies
      - name: Configure SDK
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: "cmake>=4.3" ninja
          if ($LASTEXITCODE) { throw 'Build tool installation failed' }
          cmake --preset windows-${{ inputs.architecture }} -DVCPKG_MANIFEST_MODE=OFF `
            "-DVCPKG_INSTALLED_DIR=$env:VCPKG_ROOT/installed"
      - name: Build SDK
        run: cmake --build --preset windows-${{ inputs.architecture }} --config ${{ inputs.configuration }}
      - name: Test SDK
        run: ctest --preset windows-${{ inputs.architecture }} -C ${{ inputs.configuration }} --output-junit ctest.xml --no-tests=error
      - name: Install SDK
        run: cmake --install _build/windows-${{ inputs.architecture }} --config ${{ inputs.configuration }}
      - name: Install Python build requirements
        if: inputs.wheel
        run: python -m pip install build "nanobind>=2.10,<3" numpy scipy matplotlib h5py pytest "scikit-build-core>=1.0" abi3audit
      - name: Build and audit Python wheel
        if: inputs.wheel
        shell: pwsh
        run: |
          $env:ALPS_DIR = "$pwd/_build/windows-${{ inputs.architecture }}/install/share/alps"
          python -m build --wheel --no-isolation --outdir _build/python-wheel python/pyalps `
            --config-setting "cmake.define.CMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            --config-setting "cmake.define.VCPKG_INSTALLED_DIR=$env:VCPKG_ROOT/installed" `
            --config-setting cmake.define.VCPKG_MANIFEST_MODE=OFF `
            --config-setting cmake.define.VCPKG_TARGET_TRIPLET=${{ inputs.architecture }}-windows
          if ($LASTEXITCODE) { throw 'Python wheel build failed' }
          Get-ChildItem _build/python-wheel/*.whl | ForEach-Object {
            python -m abi3audit --strict --verbose $_.FullName
            if ($LASTEXITCODE) { throw 'Python stable ABI audit failed' }
            python -m pip install --no-deps $_.FullName
            if ($LASTEXITCODE) { throw 'Python wheel installation failed' }
          }
          # abi3audit scans .pyd files, so also check the shared runtime DLL.
          $runtime = python -c "from pyalps._resources import runtime_directory; print(runtime_directory() / 'bin/pyalps_nanobind.dll')"
          Copy-Item -LiteralPath $runtime -Destination _build/python-wheel/pyalps_nanobind.pyd
          python -m abi3audit --strict --verbose --assume-minimum-abi3 3.12 _build/python-wheel/pyalps_nanobind.pyd
          if ($LASTEXITCODE) { throw 'Shared nanobind stable ABI audit failed' }
          Remove-Item -LiteralPath _build/python-wheel/pyalps_nanobind.pyd
      - name: Test Python bindings
        if: inputs.wheel
        shell: pwsh
        run: |
          $env:ALPS_DIR = "$pwd/_build/windows-${{ inputs.architecture }}/install/share/alps"
          $env:PYALPS_TEST_DOWNSTREAM_EXPORT = '1'
          $env:ALPS_TEST_CMAKE_ARGS = @('-G', 'Ninja', "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake", "-DVCPKG_INSTALLED_DIR=$env:VCPKG_ROOT/installed", '-DVCPKG_MANIFEST_MODE=OFF', '-DVCPKG_TARGET_TRIPLET=${{ inputs.architecture }}-windows') | ConvertTo-Json -Compress
          python -m pytest tests/pyalps tests/cmake -q --junitxml=_build/windows-${{ inputs.architecture }}/pytest.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.wheel
        with:
          name: cibw-wheels-windows-${{ inputs.architecture }}
          path: _build/python-wheel/*.whl
      - name: Summarize SDK and binding tests
        if: always()
        run: python .github/scripts/junit_summary.py _build/windows-${{ inputs.architecture }}/ctest.xml _build/windows-${{ inputs.architecture }}/pytest.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-windows-${{ inputs.architecture }}-${{ inputs.configuration }}-logs
          path: |
            _build/windows-${{ inputs.architecture }}/Testing/Temporary/**
            _build/windows-${{ inputs.architecture }}/CMakeFiles/CMakeConfigureLog.yaml
            _build/windows-${{ inputs.architecture }}/ctest.xml
            _build/windows-${{ inputs.architecture }}/pytest.xml
