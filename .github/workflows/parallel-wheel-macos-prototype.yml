name: Parallel wheel macOS prototype
on:
  push:
    branches: [WIP/parallel-wheel-macos-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build MPI and OpenMP wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074
        with:
          package-dir: python/pyalps
        env:
          CIBW_BUILD: cp312-macosx_arm64
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          CIBW_ENVIRONMENT_MACOS: >-
            MPI_PREFIX=${{ runner.temp }}/mpi
            PATH=${{ runner.temp }}/mpi/bin:$PATH
            ALPS_DIR=$(pwd)/_build/distribution/install/share/alps
            CMAKE_PREFIX_PATH=${{ runner.temp }}/mpi:$(pwd)/_build/boost-install
            CCACHE_DIR=$(pwd)/_build/ccache
            CMAKE_BUILD_PARALLEL_LEVEL=2
          CIBW_TEST_COMMAND: 'python -m pytest -v {project}/tests/pyalps/test_wheel_cli.py {project}/tests/pyalps/test_checkpoint_contracts.py {project}/tests/pyalps/test_conversion_contracts.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parallel-wheel-macos
          path: wheelhouse/*.whl
      - name: Install and test outside the build environment
        run: |
          python -m pip install wheelhouse/*.whl pytest h5py mpi4py
          python -m pytest -v -s tests/pyalps/test_parallel_wheel.py
